<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vishodhan Krishnan Portfolio</title>
  <meta name="description" content="Vishodhan Krishnan — AI Engineer building multi-agent LLM systems, RAG pipelines, and fine-tuned models across healthcare, finance, and enterprise data.">
  <meta name="theme-color" content="#0E1415">
  <meta name="color-scheme" content="dark light">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="Vishodhan Krishnan Portfolio">
  <meta property="og:description" content="Multi-agent LLM systems, RAG pipelines, and fine-tuned models across healthcare, finance, and enterprise data.">
  <meta property="og:image" content="assets/img/vishodhan-krishnan-cropped.jpg">
  <meta name="twitter:card" content="summary">

  <!-- Roboto Flex (headings and body), JetBrains Mono (dates and metrics), Material Symbols (icons) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,75..125,300..700&family=JetBrains+Mono:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="style.css">

  <!-- Deliberately not deferred, and placed after the meta tags it reads: this
       applies the saved theme before first paint, then fills the sections in
       below once the DOM is ready. -->
  <script src="app.js"></script>
</head>

<body>
  <p id="live" class="sr-only" role="status" aria-live="polite"></p>

  <nav class="nav-rail" id="nav-rail" aria-label="Sections"></nav>

  <header class="app-bar" id="app-bar">
    <a class="brand" href="#home">
      <span class="brand__dot" aria-hidden="true"></span>
      <span>VK</span>
    </a>
    <button type="button"
            id="theme-toggle"
            class="icon-btn state"
            aria-pressed="false"
            aria-label="Switch to light theme"
            title="Switch to light theme">
      <span class="material-symbols-rounded" aria-hidden="true">light_mode</span>
    </button>
  </header>

  <main>
    <noscript>
      <div class="shell">
        <div class="notice">
          <h2>JavaScript is switched off</h2>
          <p>This page builds itself from the content in <code>app.js</code>, so it needs JavaScript
             to render. Turn it on and reload, or read that file directly — the text is all at the
             top, in plain form.</p>
        </div>
      </div>
    </noscript>

    <!-- Each section is filled by app.js. Add an entry to CONTENT.nav too if it
         should be a nav destination; Education deliberately is not one. -->
    <section class="section" id="home" aria-labelledby="home-heading">
      <div class="shell" id="home-body"></div>
    </section>

    <section class="section" id="work" aria-labelledby="work-heading">
      <div class="shell" id="work-body"></div>
    </section>

    <section class="section" id="education" aria-labelledby="education-heading">
      <div class="shell" id="education-body"></div>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-heading">
      <div class="shell" id="projects-body"></div>
    </section>

    <section class="section" id="skills" aria-labelledby="skills-heading">
      <div class="shell" id="skills-body"></div>
    </section>

    <section class="section" id="contact" aria-labelledby="contact-heading">
      <div class="shell" id="contact-body"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell" id="footer-body"></div>
  </footer>

  <nav class="nav-bar" id="nav-bar" aria-label="Sections"></nav>
</body>
</html>
