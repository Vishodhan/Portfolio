<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vishodhan Krishnan — AI Engineer</title>
  <meta name="description" content="Vishodhan Krishnan — AI Engineer building multi-agent LLM systems, RAG pipelines, and fine-tuned models across healthcare, finance, and enterprise data.">
  <meta name="theme-color" content="#0E1415">
  <meta name="color-scheme" content="dark light">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="Vishodhan Krishnan — AI Engineer">
  <meta property="og:description" content="Multi-agent LLM systems, RAG pipelines, and fine-tuned models across healthcare, finance, and enterprise data.">
  <meta property="og:image" content="assets/img/vishodhan-krishnan-cropped.jpg">
  <meta name="twitter:card" content="summary">


  <!-- Fonts: Roboto Flex (M3 brand + plain roles), JetBrains Mono (utility), Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,75..125,300..700&family=JetBrains+Mono:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <!-- Design tokens + components -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- Tailwind, bridged to the same M3 colour tokens -->
  <script src="https://cdn.tailwindcss.com?plugins=" defer></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            primary: 'rgb(var(--md-ref-primary) / <alpha-value>)',
            'on-primary': 'rgb(var(--md-ref-on-primary) / <alpha-value>)',
            'primary-container': 'rgb(var(--md-ref-primary-container) / <alpha-value>)',
            secondary: 'rgb(var(--md-ref-secondary) / <alpha-value>)',
            tertiary: 'rgb(var(--md-ref-tertiary) / <alpha-value>)',
            surface: 'rgb(var(--md-ref-surface) / <alpha-value>)',
            'on-surface': 'rgb(var(--md-ref-on-surface) / <alpha-value>)',
            'on-surface-variant': 'rgb(var(--md-ref-on-surface-variant) / <alpha-value>)',
            'surface-container': 'rgb(var(--md-ref-surface-container) / <alpha-value>)',
            outline: 'rgb(var(--md-ref-outline) / <alpha-value>)',
            'outline-variant': 'rgb(var(--md-ref-outline-variant) / <alpha-value>)'
          },
          borderRadius: {
            xs: 'var(--md-sys-shape-corner-extra-small)',
            sm: 'var(--md-sys-shape-corner-small)',
            md: 'var(--md-sys-shape-corner-medium)',
            lg: 'var(--md-sys-shape-corner-large)',
            xl: 'var(--md-sys-shape-corner-extra-large)'
          }
        }
      }
    };
  </script>

  <!-- Applies the saved theme before first paint so there is no flash -->
  <script src="assets/js/theme.js"></script>
</head>

<body>
  <p id="live-region" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Navigation rail — desktop -->
  <nav class="md-nav-rail" id="nav-rail" aria-label="Sections"></nav>

  <!-- Top app bar -->
  <header class="md-top-app-bar" id="app-bar">
    <a class="pf-brand" href="#home">
      <span class="pf-brand__dot" aria-hidden="true"></span>
      <span>VK</span>
    </a>
    <button type="button"
            id="theme-toggle"
            class="md-icon-button md-state"
            aria-pressed="false"
            aria-label="Switch to light theme"
            title="Switch to light theme">
      <span class="material-symbols-rounded" aria-hidden="true">light_mode</span>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <noscript>
      <div class="pf-shell">
        <div class="pf-notice">
          <h2 class="md-title-medium">JavaScript is switched off</h2>
          <p class="md-body-medium" style="margin-top:8px">
            This page assembles itself from JSON in the <code>/data</code> folder, so it needs
            JavaScript to render. Turn it on and reload, or read the raw content at
            <code>data/profile.json</code> and <code>data/experience.json</code>.
          </p>
        </div>
      </div>
    </noscript>

    <div class="pf-shell">
      <div class="pf-notice" id="load-error" role="alert" hidden></div>
    </div>

    <section class="pf-section" id="home" aria-labelledby="home-heading">
      <div class="pf-shell">
        <h2 class="sr-only" id="home-heading" tabindex="-1">Introduction</h2>
        <div id="home-content"></div>
      </div>
    </section>

    <section class="pf-section" id="work" aria-labelledby="work-heading">
      <div class="pf-shell" id="work-content"></div>
    </section>

    <section class="pf-section" id="projects" aria-labelledby="projects-heading">
      <div class="pf-shell" id="projects-content"></div>
    </section>

    <section class="pf-section" id="skills" aria-labelledby="skills-heading">
      <div class="pf-shell" id="skills-content"></div>
    </section>

    <section class="pf-section" id="contact" aria-labelledby="contact-heading">
      <div class="pf-shell" id="contact-content"></div>
    </section>
  </main>

  <footer class="pf-footer">
    <div class="pf-shell" id="site-footer"></div>
  </footer>

  <!-- Navigation bar — compact widths -->
  <nav class="md-nav-bar" id="nav-bar" aria-label="Sections"></nav>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
